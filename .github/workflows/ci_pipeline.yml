name: RoNIN Production Quality Gate (CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy scipy h5py matplotlib pytest

    - name: Run Quality Gate Suite (Latency, Drift, ATE Accuracy)
      run: |
        pytest tests/test_production_gates.py -v -s

    - name: Upload Trajectory Artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: trajectory-evaluation-report
        path: reports/
